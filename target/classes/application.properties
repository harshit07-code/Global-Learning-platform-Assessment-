# ==========================================
# Database Connection Configuration (MySQL)
# ==========================================

# The URL tells Hibernate where our MySQL database is located.
# "booking_system" is our database name.
# "createDatabaseIfNotExist=true" is super handy! If you haven't created the database yet, MySQL will create it for you automatically.
# "serverTimezone=UTC" is standard best practice for handling timezone calculations properly.
spring.datasource.url=jdbc:mysql://localhost:3306/booking_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC

# The default username for MySQL is usually "root".
spring.datasource.username=root

# Change this password to match your local MySQL server's password.
# (If you don't have a password set, you can leave it blank)
spring.datasource.password=root

# The driver class name that Spring uses to talk to MySQL.
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver


# ==========================================
# JPA / Hibernate Configurations
# ==========================================

# We want Hibernate to show us the actual SQL queries it runs in the console.
# This is amazing for debugging and learning how JPA works!
spring.jpa.show-sql=true

# This formats the printed SQL nicely in the console instead of showing it in one long line.
spring.jpa.properties.hibernate.format_sql=true

# This tells Spring Boot NOT to auto-generate tables from Java classes directly.
# Instead, we will define our tables using "schema.sql" for complete control.
spring.jpa.hibernate.ddl-auto=none


# ==========================================
# SQL Database Initialization (schema & seed data)
# ==========================================

# This tells Spring Boot to run our "schema.sql" and "data.sql" files on application startup.
# "always" means it will execute them every time you run the server.
spring.sql.init.mode=always

# We set the initialization schema-creation policy.
# We will use "schema.sql" to define tables and "data.sql" to load sample data.
spring.sql.init.schema-locations=classpath:schema.sql
spring.sql.init.data-locations=classpath:data.sql


# ==========================================
# Logging Settings
# ==========================================

# If we want to see SQL bind parameters (the actual values injected into SQL queries),
# we can set this logger to TRACE.
logging.level.org.hibernate.orm.jdbc.bind=trace
